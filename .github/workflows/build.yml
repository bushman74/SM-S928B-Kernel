name: Build kernel

# MANUAL ONLY. Do not add push / pull_request / schedule triggers — CI minutes and disk
# are not to be spent automatically. Every build is started by hand from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      toolchain:
        description: "Toolchain: 'reference' (what Samsung used) or an AOSP clang build id"
        required: true
        default: reference
      lto:
        description: "LTO mode: none | thin | full (stock e3q is LTO_NONE — see docs/FACTS.md §0.5)"
        required: true
        default: none
        type: choice
        options: [none, thin, full]
      clean:
        description: "Ignore ccache and build from scratch"
        required: false
        default: false
        type: boolean
      release:
        description: "Publish the built artifacts to a GitHub Release (with SHA256SUMS for integrity)"
        required: false
        default: false
        type: boolean

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Free runners cap at 6 hours. A cold Kleaf build on 4 vCPU can get close.
    timeout-minutes: 350
    # Only the optional release step needs it; the default GITHUB_TOKEN is read-only unless asked.
    # (cache/upload-artifact use the Actions runtime token, not these scopes, so this is safe.)
    permissions:
      contents: write

    steps:
      # MUST be early. Runners ship with ~14 GB usable of a ~72 GB volume; a Kleaf
      # build wants far more. This reclaims roughly 30 GB.
      # Pinned to a tag on purpose: @main is mutable and would change under us mid-project.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false   # keep swap; Bazel link steps are memory-hungry

      - name: Report starting disk and assert headroom
        run: |
          df -h /
          # A source checkout (~3.5 GB) + prebuilts (~6 GB) + a Kleaf build need tens of GB.
          # Fail here, before the fetch/compile, if the free-disk step didn't reclaim enough.
          avail_gb=$(df -BG --output=avail / | tail -1 | tr -dc '0-9')
          echo "Free on /: ${avail_gb} GB"
          if [ "${avail_gb:-0}" -lt 40 ]; then
            echo "::error::Only ${avail_gb} GB free — need ~40+ GB for source + prebuilts + build. Aborting before the fetch."
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          submodules: recursive

      # These are written in Phase 1/3. Until then the job should say so plainly
      # rather than dying on "No such file or directory" three steps later.
      - name: Preflight — required scripts present and executable
        run: |
          missing=0
          for s in scripts/setup-toolchain.sh scripts/build.sh scripts/package.sh; do
            if [[ ! -f "$s" ]]; then
              echo "::error::$s does not exist yet. See docs/PLAN.md — it is written in Phase 1."
              missing=1
            elif [[ ! -x "$s" ]]; then
              echo "::error::$s exists but is not executable. Run: git update-index --chmod=+x $s"
              missing=1
            fi
          done
          exit $missing

      # Cheap source-level gate (runs before the ~40-minute build): prove that gki_defconfig
      # differs from the pristine Samsung 'vanilla' import ONLY by the allowlisted protection
      # symbols. A stray CONFIG edit fails here instead of shipping a surprise kernel.
      # checkout is depth-1, so fetch the vanilla tip first (blob diff needs no shared history).
      - name: Verify defconfig parity — only protections changed vs vanilla
        run: |
          git fetch --no-tags --depth=1 origin vanilla
          scripts/check-defconfig-parity.sh FETCH_HEAD

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache cpio curl flex git \
            libelf-dev libssl-dev lz4 zstd python3 python3-pip \
            rsync unzip zip openjdk-17-jdk-headless

      - name: Restore ccache
        if: ${{ inputs.clean == false }}
        uses: actions/cache@v5
        with:
          path: ~/.ccache
          # 10 GB repo-wide cache limit, evicted after 7 days unused.
          key: ccache-${{ inputs.toolchain }}-${{ inputs.lto }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ inputs.toolchain }}-${{ inputs.lto }}-
            ccache-${{ inputs.toolchain }}-

      - name: Configure ccache
        run: |
          ccache -M 8G
          ccache -o compression=true
          ccache -z
          echo "USE_CCACHE=1" >> "$GITHUB_ENV"
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"

      # The prebuilts (clang + host tools) are ~6 GB fetched from googlesource. Cache
      # them keyed on the fetch script so a normal run reuses them; setup-toolchain.sh is
      # idempotent, so on a cache hit it just verifies and returns.
      - name: Restore prebuilts
        if: ${{ inputs.clean == false }}
        uses: actions/cache@v5
        with:
          path: kernel_platform/prebuilts
          key: prebuilts-${{ inputs.toolchain }}-${{ hashFiles('scripts/setup-toolchain.sh') }}

      - name: Fetch toolchain
        run: ./scripts/setup-toolchain.sh "${{ inputs.toolchain }}"

      - name: Build
        env:
          LTO_MODE: ${{ inputs.lto }}
          # Phase 2 requires two clean builds to match. Without these pinned, the
          # timestamp/user/host baked into the image differ on every run and the
          # comparison is meaningless.
          KBUILD_BUILD_TIMESTAMP: "Thu Jan  1 00:00:00 UTC 1970"
          KBUILD_BUILD_USER: builder
          KBUILD_BUILD_HOST: e3q
        run: ./scripts/build.sh

      - name: Package
        run: ./scripts/package.sh
        # package.sh handles the partition-level steps only (SEANDROIDENFORCE footer, vbmeta,
        # ramdisk compression). Security-protection neutralization is done in source, not here.

      - name: ccache stats
        if: always()
        run: ccache -s

      - name: Report final disk
        if: always()
        run: df -h /

      # Upload each flashable artifact SEPARATELY, in its native extension — no wrapping ZIP.
      # upload-artifact@v7 with `archive: false` uploads ONE file as-is and names the artifact
      # after that file (the `name:` input is ignored), so the run's artifacts download directly
      # as `boot.img`, `e3q-kernel-<date>-AK3.zip`, etc. — not a zip-of-files — and the already
      # zipped AK3/modules are NOT re-zipped (the "double-zip" the changelog calls out).
      #
      # Deliberately NOT `out/dist/*.img`: build.sh stages many byproduct images (vendor_boot,
      # vendor_dlkm ~282 MB, system_dlkm, dtb/dtbo) that must not be flashed for the boot.img-only
      # first boot — shipping them is a footgun and bloats the run. See docs/FLASHING.md.
      #
      # `archive: false` takes exactly one file, so resolve the date-stamped zip names to literal
      # paths here (asserting at most one of each) instead of relying on a wildcard under archive:false.
      - name: Resolve date-stamped artifact paths
        if: success()
        id: artifacts
        run: |
          set -euo pipefail
          shopt -s nullglob
          ak3=( out/dist/e3q-kernel-*-AK3.zip )
          mods=( out/dist/e3q-modules-*.zip )
          if [ "${#ak3[@]}" -gt 1 ]; then
            echo "::error::expected at most 1 AnyKernel3 zip in out/dist, found ${#ak3[@]}: ${ak3[*]}"; exit 1
          elif [ "${#ak3[@]}" -eq 1 ]; then
            echo "ak3=${ak3[0]}" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::no AnyKernel3 zip found in out/dist"
          fi
          if [ "${#mods[@]}" -gt 1 ]; then
            echo "::error::expected at most 1 modules zip in out/dist, found ${#mods[@]}: ${mods[*]}"; exit 1
          elif [ "${#mods[@]}" -eq 1 ]; then
            echo "modules=${mods[0]}" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::no modules zip found in out/dist"
          fi

      - name: Upload boot.img (native)
        if: success()
        uses: actions/upload-artifact@v7
        with:
          path: out/dist/boot.img
          archive: false
          retention-days: 30
          if-no-files-found: error

      - name: Upload AnyKernel3 zip (native)
        if: ${{ success() && steps.artifacts.outputs.ak3 != '' }}
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.artifacts.outputs.ak3 }}
          archive: false
          retention-days: 30
          if-no-files-found: error

      - name: Upload Odin boot.tar.md5 (native)
        if: success()
        uses: actions/upload-artifact@v7
        with:
          path: out/dist/boot.tar.md5
          archive: false
          retention-days: 30
          if-no-files-found: warn

      - name: Upload modules zip (native)
        if: ${{ success() && steps.artifacts.outputs.modules != '' }}
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.artifacts.outputs.modules }}
          archive: false
          retention-days: 30
          if-no-files-found: warn

      # The build log is the comprehensive tee'd output of the whole build — upload it native
      # (single file, no ZIP). `archive: false` is one file per artifact, so we ship build.log
      # itself rather than a zipped bundle of the log tree; `always()` so it survives a failed build.
      - name: Upload build log (native)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          path: out/build.log
          archive: false
          retention-days: 30
          if-no-files-found: warn

      # Publish a GitHub Release with the native artifacts + a SHA256SUMS file, so anyone can
      # integrity-check a download (`sha256sum -c SHA256SUMS`). Opt-in via the `release` input —
      # a release is a deliberate act, not something every build should spam. Uses the pre-installed
      # `gh` CLI and needs `contents: write` (declared on the job above).
      - name: Publish GitHub Release (artifacts + SHA256SUMS)
        if: ${{ success() && inputs.release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          # Kernel version for the title/notes (best-effort; never fails the release).
          kver="$(sed -nE 's/^VERSION = //p; s/^PATCHLEVEL = //p; s/^SUBLEVEL = //p' \
                  kernel_platform/common/Makefile 2>/dev/null | paste -sd. - || true)"
          cd out/dist
          # The same set the upload steps ship: literals stay, wildcards expand (nullglob).
          candidates=( boot.img boot.tar.md5 e3q-kernel-*-AK3.zip e3q-modules-*.zip )
          files=()
          for f in "${candidates[@]}"; do [ -e "$f" ] && files+=("$f"); done
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::no flashable artifacts in out/dist to release"; exit 1
          fi
          sha256sum "${files[@]}" | tee SHA256SUMS
          tag="build-${{ github.run_number }}"
          {
            echo "Automated e3q (SM-S928B) kernel build #${{ github.run_number }} — Linux ${kver:-6.1.x}, LTO=${{ inputs.lto }}."
            echo "Commit \`${{ github.sha }}\`."
            echo
            echo "**Verify integrity:** download \`SHA256SUMS\` next to the files, then run:"
            echo '```'
            echo "sha256sum -c SHA256SUMS"
            echo '```'
            echo "**Flash** per \`docs/FLASHING.md\`. Compiling is not testing — verify on-device before trusting a build."
            echo
            echo "SHA256:"
            echo '```'
            cat SHA256SUMS
            echo '```'
          } > release-notes.md
          if ! gh release create "$tag" "${files[@]}" SHA256SUMS \
                 --repo "${{ github.repository }}" \
                 --target "${{ github.sha }}" \
                 --title "e3q kernel — build #${{ github.run_number }}" \
                 --notes-file release-notes.md; then
            echo "::notice::release $tag already exists — updating its assets"
            gh release upload "$tag" "${files[@]}" SHA256SUMS --repo "${{ github.repository }}" --clobber
          fi
          echo "Released as tag $tag with ${#files[@]} artifact(s) + SHA256SUMS."
